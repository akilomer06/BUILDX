server {
    listen 80;
    server_name _;
    # Keep the host-only operator context from accepting arbitrary DNS names.
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    location /api/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $http_host;
        proxy_set_header X-VEILMINT-Operator ${VEILMINT_OPERATOR_TOKEN};
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://backend:8000/ready; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
}
