server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 16k;
    location /api/bank/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $http_host;
        proxy_set_header X-VEILMINT-Operator "";
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://backend:8000/ready; }
    location = / { return 302 /bank/; }
    location = /bank { return 302 /bank/; }
    location = /index.html { internal; }
    location /bank/ { try_files $uri /index.html; }
    location /assets/ { try_files $uri =404; }
    location / { return 404; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
